apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: dndjeh/navisafe-frontend:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: NODE_ENV
              value: "development"
            - name: VITE_API_BASE_URL
              value: "https://www.navisafe.co.kr"
          command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5173
      nodePort: 30173
