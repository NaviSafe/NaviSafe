apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: navisafe-postgres
spec:
  serviceName: navisafe-postgres
  replicas: 1
  selector:
    matchLabels:
      app: navisafe-postgres
  template:
    metadata:
      labels:
        app: navisafe-postgres
    spec:
      containers:
        - name: postgres
          image: navisafe-postgres:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: navisafe-postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data-pvc