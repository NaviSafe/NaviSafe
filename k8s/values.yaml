env:
  - name: ES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: fluent-bit-es-secret
        key: ES_PASSWORD

config:
  service: |
    [SERVICE]
        Flush         1
        Daemon        Off
        Log_Level     info
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        
    [INPUT]
        Name              tail
        Path              /opt/airflow/logs/**/*.log
        Tag               airflow.task.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log On
        K8S-Logging.Parser On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name es
        Match kube.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        Logstash_Format On
        Logstash_Prefix navisafe
        Suppress_Type_Name On
        tls On
        tls.verify Off

    [OUTPUT]
        Name es
        Match airflow.task.*
        Host elasticsearch-master
        Port 9200
        HTTP_User elastic
        HTTP_Passwd ${ES_PASSWORD}
        Logstash_Format On
        Logstash_Prefix navisafe-airflow-task
        Suppress_Type_Name On
        tls On
        tls.verify Off