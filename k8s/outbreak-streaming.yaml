apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: outbreak-streaming
  namespace: default

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  sparkVersion: 3.5.1

  image: dndjeh/outbreak-streaming:v4
  imagePullPolicy: IfNotPresent

  mainApplicationFile: local:///app/outbreak_streaming.py

  # deps:
  #   packages:
  #     - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1

  sparkConf:
    spark.pyspark.python: python3
    spark.pyspark.driver.python: python3

    # 🔥🔥 핵심 (이거 하나로 해결됨)
    spark.jars.ivy: /tmp/.ivy

  restartPolicy:
    type: Never

  driver:
    cores: 1
    memory: 512m
    serviceAccount: spark
    env:
      - name: KAFKA_BOOTSTRAP
        value: kafka-svc.default:9092

  executor:
    instances: 1
    cores: 1
    memory: 512m