apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      serviceAccountName: airflow

      securityContext:
        runAsUser: 50000
        fsGroup: 50000

      volumes:
        - name: airflow-logs
          #emptyDir: {}
          persistentVolumeClaim:
            claimName: airflow-logs-pvc

        - name: pod-template
          configMap:
            name: airflow-pod-template

      containers:
        - name: webserver
          image: dndjeh/navisafe-airflow:v10
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: airflow-logs
              mountPath: /opt/airflow/logs

            - name: pod-template
              mountPath: /opt/airflow/pod_templates

          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: KubernetesExecutor

            - name: AIRFLOW__CORE__FERNET_KEY
              value: 5ozw1xClhNUKElcA31BOLTCr3f8de2whokz13dLXQ1w=

            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"

            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: mysql+pymysql://user:userpass@mysql.default:3306/airflow_db

            - name: AIRFLOW__KUBERNETES_EXECUTOR__POD_TEMPLATE_FILE
              value: /opt/airflow/pod_templates/airflow-pod-template.yaml

          command:
            - bash
            - -c
            - airflow webserver