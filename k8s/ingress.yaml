apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navisafe-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: navisafe.co.kr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80