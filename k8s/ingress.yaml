apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navisafe-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare

spec:
  ingressClassName: traefik

  rules:
  - host: www.navisafe.co.kr
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80

  tls:
  - hosts:
    - navisafe.co.kr
