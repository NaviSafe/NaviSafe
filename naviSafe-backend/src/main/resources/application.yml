spring:
  application:
    name: naviSafe-backend

  datasource:
      mysql:
        jdbc-url : jdbc:mysql://mysql.default.svc.cluster.local:3306/toy_project?rewriteBatchedStatements=true&profileSQL=true&logger=Slf4JLogger
        username: user
        password: userpass
        driver-class-name: com.mysql.cj.jdbc.Driver
      postgres:
        jdbc-url: jdbc:postgresql://navisafe-postgres.default.svc.cluster.local:5432/navigation
        username: root
        password: 991120
        driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: redis
      port: 6379
      timeout: 6000ms

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl 


logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

