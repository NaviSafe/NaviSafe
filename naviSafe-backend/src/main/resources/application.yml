spring:
  application:
    name: naviSafe-backend

  datasource:
    #url: jdbc:mysql://host.docker.internal:3307/toy_project
    url: jdbc:mysql://mysql:3306/toy_project?rewriteBatchedStatements=true&profileSQL=true&logger=Slf4JLogger
    username: user
    password: userpass

  data:
    redis:
      host: redis
      port: 6379
      timeout: 6000ms

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl 


logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

tmap:
  base-url: https://apis.openapi.sk.com
